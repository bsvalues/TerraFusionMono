version: '3.9'
services:
  app:
    build: .
    container_name: terrafusion-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
    volumes:
      - ./:/usr/src/app
    command: ["npm", "run", "start"]

  db:
    image: postgres:15
    container_name: terrafusion-db
    environment:
      POSTGRES_USER: terrafusion
      POSTGRES_PASSWORD: terrafusion
      POSTGRES_DB: terrafusion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    container_name: terrafusion-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: terrafusion-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  pgdata:
